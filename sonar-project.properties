sonar.projectKey=NovaShop-Project
# حدد مجلدات الكود
sonar.sources=config,Controllers,middlewares,models,routes,utils,.,index.js

# استبعد الملفات والمجلدات اللي مالهاش لازمة
sonar.exclusions=node_modules/**,coverage/**,test/**

# لو عندك اختبارات تغطية (coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# اللغة الافتراضية
sonar.language=js
