
trigger:
  branches:
    include:
      - main
      - feature/*


pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest


variables:
  - group: auth-variables

stages:
- stage: Install_Node_JS
  displayName: 'Install Node Js and dependencies'
  jobs:
    - job:  Install_Node_JS
      displayName: 'Install Node Js and dependencies'
      steps:
        - task: UseNode@1
          inputs:
            version: '22.x'
          displayName: 'Install Node.js'

        - script: npm ci
          displayName: 'Install Dependencies'

        # - task: WhiteSource@21
        #   inputs:
        #     cwd: '$(System.DefaultWorkingDirectory)'

